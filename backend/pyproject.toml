[project]
name = "zimdash-api"
version = "0.1.0"
description = "ZIM DASH backend — FastAPI service (ADR-005), Postgres + Redis, JWT auth, SSE realtime (ADR-006)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    # Alembic migrations run synchronously; psycopg (binary) is the driver
    # for that, separate from asyncpg which the app itself uses at runtime.
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "redis>=5.1,<6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7,<1",
    "black>=24.10,<25",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle errors. I: import sorting. UP: pyupgrade.
# B: bugbear (common real bugs). ASYNC: common async mistakes.
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# UP042: `class X(str, enum.Enum)` is deliberate, not a pyupgrade target —
# it's the standard pattern for a SQLAlchemy Enum column (PgEnum reads
# member.value off it); `enum.StrEnum` changes str()/repr() behavior and
# ruff itself flags its own suggested fix here as unsafe.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# Alembic generates these; they're reviewed and edited, not hand-formatted
# to house style from scratch.
"alembic/versions/*.py" = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# DB-backed tests (migrations) need a live Postgres - excluded by default so
# a plain `pytest` never requires one; run them with `pytest -m db` after
# `docker compose up -d db`.
addopts = "-m 'not db'"
markers = ["db: needs a live Postgres (DATABASE_URL)"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
