[project]
name = "zimdash-api"
version = "0.1.0"
description = "ZIM DASH backend — FastAPI service (ADR-005), Postgres + Redis, JWT auth, SSE realtime (ADR-006)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.13,<2",
    "redis>=5.1,<6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7,<1",
    "black>=24.10,<25",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle errors. I: import sorting. UP: pyupgrade.
# B: bugbear (common real bugs). ASYNC: common async mistakes.
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
